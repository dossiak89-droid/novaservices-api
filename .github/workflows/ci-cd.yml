name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Droits minimaux par défaut : lecture du code seulement.
permissions:
  contents: read

jobs:
  # 1) Tests automatiques (pull request ET fusion sur main)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -q

  # 2) Construire l'image et contrôler qu'elle démarre (pull request ET main)
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t application-tp:ci --build-arg GIT_COMMIT=${{ github.sha }} .

      - name: Démarrer l'image et contrôler /health puis /version
        run: |
          docker run -d --name app-ci -p 8080:8000 application-tp:ci
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            docker logs app-ci
            exit 1
          fi
          curl -fsS http://localhost:8080/version | grep -q "${{ github.sha }}"

  # 3) Publier dans GHCR : uniquement après fusion sur main
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image en minuscules (obligatoire pour GHCR)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier (tag = commit Git)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}

      - name: Contrôler l'image publiée, appelée par son digest
        run: |
          docker run -d --name app-pub -p 8081:8000 "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8081/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            docker logs app-pub
            exit 1
          fi

      - name: Garder le digest comme preuve
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image : ${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest : ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # 4) Déployer sur la VM de préproduction
  deploy:
    needs: publish
    # Si la VM est dans le réseau de l'école, remplacer par : [self-hosted, labo]
    runs-on: ubuntu-latest
    environment: preproduction
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Préparer SSH (clé privée et empreinte vérifiée)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Lancer deploy.sh sur la VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          COMMIT: ${{ github.sha }}
          SIMULATE_FAILURE: ${{ vars.SIMULATE_FAILURE }}
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "IMAGE='$IMAGE' DIGEST='$DIGEST' COMMIT='$COMMIT' SIMULATE_FAILURE='$SIMULATE_FAILURE' bash -s" < deploy.sh
